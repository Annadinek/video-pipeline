# produce.yml — берёт самое старое сырое видео, обрабатывает длинное видео
# и присылает Анне в Telegram на проверку (Круг 1). Публикацию делает poll.yml
# после ответа «ОК».
name: produce

on:
  # Раз в сутки ночью. 01:00 UTC = 04:00 Стамбул.
  schedule:
    - cron: "0 1 * * *"
  # Ручной запуск (кнопкой или из бота). Можно задать конкретный video_id.
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID видео (пусто = взять самое старое из «Клауд сырое»)"
        required: false
        default: ""

# Один общий замок с poll.yml — чтобы не драться за state.json и getUpdates.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      # ВРЕМЕННО: модель распознавания речи. medium в 3-4 раза быстрее large-v3
      # на процессоре, точность для русского всё ещё хорошая. Замерим и выберем.
      WHISPER_MODEL: medium
    steps:
      - uses: actions/checkout@v4

      - name: Свободное место до старта
        run: df -h .

      - name: Установка инструментов
        run: bash scripts/setup.sh

      # Разбито на отдельные шаги — чтобы в статусе GitHub было видно, где мы и где тормозит.
      - name: 1) Скачивание видео
        run: |
          set -euo pipefail
          VID="${{ github.event.inputs.video_id }}"
          python3 scripts/01_download.py "$VID"
          if [ ! -f work/00_raw.mp4 ]; then
            echo "Новых видео нет — выходим."
            echo "NO_VIDEO=1" >> "$GITHUB_ENV"
            exit 0
          fi
          SRC=$(python3 -c "import sys; sys.path.insert(0,'scripts'); import importlib; m=importlib.import_module('00_pick_video'); it=m.pick_oldest(); print(it['video_id'] if it else '')")
          echo "SRC=${VID:-$SRC}" >> "$GITHUB_ENV"
          ls -lh work/00_raw.mp4

      # Шаг 2: вырезаем паузы/тишину -> work/02_cut.mp4. Делаем ДО расшифровки,
      # чтобы субтитры считались уже по видео без пауз и точно совпадали.
      - name: 1.5) Вырезка пауз (тишины)
        if: ${{ env.NO_VIDEO != '1' }}
        run: python3 scripts/02_cut_pauses.py

      # Сначала расшифровка и субтитры — чтобы обработка сразу ВШИЛА субтитры.
      - name: 2) Расшифровка речи (по видео без пауз)
        if: ${{ env.NO_VIDEO != '1' }}
        run: python3 scripts/03_transcribe.py

      - name: 3) Субтитры (srt + стильные ass)
        if: ${{ env.NO_VIDEO != '1' }}
        run: python3 scripts/05_subtitles.py

      - name: 4) Обработка (стабилизация, резкость, звук, субтитры)
        if: ${{ env.NO_VIDEO != '1' }}
        run: bash scripts/02_process.sh

      - name: 5) Отправка на проверку в Telegram
        if: ${{ env.NO_VIDEO != '1' }}
        run: python3 scripts/06_review_send.py "$SRC"

      - name: Журнал + сохранить состояние
        if: always()
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M UTC') — produce, свободно: $(df -h . | tail -1 | awk '{print $4}')" >> log.md
          git config user.name "video-pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add log.md state.json review 2>/dev/null || true
          git commit -m "produce: обработка и отправка на проверку" || echo "нечего коммитить"
          git push || echo "push не удался"
