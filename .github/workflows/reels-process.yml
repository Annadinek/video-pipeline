# reels-process.yml — КАРКАС отдельной ветки конвейера для вертикали (Reels/TikTok).
# Vizard здесь НЕ используется (он остаётся только для YouTube). Свои файлы с
# приставкой reels_, YouTube-конвейер не трогаем.
#
# 🚧 Жду образцы от Анны — обработка ещё не написана, поэтому кнопка пока только
# проверяет, что каркас на месте. Ничего не публикует.
name: reels-process

on:
  workflow_dispatch:

concurrency:
  group: reels-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Проверка каркаса (жду образцы от Анны)
        run: python3 scripts/reels_process.py
