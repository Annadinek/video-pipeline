# drive-move.yml — попытаться перенести обработанные исходники в папку «готовые видео»
# используя YouTube-OAuth из секретов (проверка: хватает ли его прав на Google Drive).
# Токен доступа НЕ печатается. Печатаются только HTTP-коды и ответы API (без секретов).
name: drive-move

on:
  push:
    branches:
      - "claude/reels-process-scaffold"
    paths:
      - "state/drive_move.txt"
  workflow_dispatch:

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      DEST: "1SDdMUPKVH-8aUEchett5poqgs7fDiTTy"      # папка «готовые видео»
      SRC: "1-3QGPa3MiQrU-xbgh2I72gp8mTkLRzWx"       # папка «Сырое»
    steps:
      - name: Получить access token и попробовать перенос
        run: |
          set -e
          # access token (в переменную, не в лог)
          AT=$(curl -s https://oauth2.googleapis.com/token \
            -d client_id="$YT_CLIENT_ID" -d client_secret="$YT_CLIENT_SECRET" \
            -d refresh_token="$YT_REFRESH_TOKEN" -d grant_type=refresh_token \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          if [ -z "$AT" ]; then echo "НЕ удалось получить access token (проверь YT_* секреты)"; exit 1; fi
          echo "access token получен."
          # проверка scope токена
          echo "== scope токена =="
          curl -s "https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=$AT" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('scope:',d.get('scope','?'));print('email:',d.get('email','?'))" || true
          # попытка переноса файлов
          for FID in 1ItRowt8H0FYlr20jFhGAw__jg0iSNYmn 1DIzgWt0KrBH2Ll4V4gi6ZJWX_lTLxPMj; do
            echo "== перенос $FID =="
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH \
              "https://www.googleapis.com/drive/v3/files/$FID?addParents=$DEST&removeParents=$SRC&supportsAllDrives=true&fields=id,parents,name" \
              -H "Authorization: Bearer $AT" -H "Content-Length: 0")
            echo "HTTP $code"; cat /tmp/resp.json; echo
          done
