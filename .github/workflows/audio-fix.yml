name: audio-fix

# Тест звука по кнопке: ссылка YouTube → качается кусок → прогоняется
# scripts/audio_clean.py → в логе отчёт (спектр по полосам), файл(ы) в артефактах.
# variants=false: один файл clip_audio_clean.mp4 (цепочка по presets/audio.json).
# variants=true:  два файла clip_hp / clip_hp_eq (только highpass vs highpass+подъём верха).
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Ссылка на видео YouTube'
        required: true
        type: string
      start:
        description: 'С какого места брать (мм:сс)'
        required: false
        default: '0:00'
        type: string
      seconds:
        description: 'Сколько секунд взять'
        required: false
        default: '30'
        type: string
      variants:
        description: 'Два варианта: hp и hp_eq (highpass vs highpass+подъём верха)'
        required: false
        default: false
        type: boolean

jobs:
  audiofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Движок JavaScript — без него yt-dlp не решает n-challenge и не качает видео.
      - name: Ставим Deno (движок JS)
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Ставим yt-dlp и ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" yt-dlp-ejs
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Скачиваем отрезок (только для теста)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          URL: ${{ inputs.url }}            # через env — без подстановки в shell
          START: ${{ inputs.start }}
          SECONDS_ARG: ${{ inputs.seconds }}
        run: |
          python scripts/fetch_youtube.py \
            --url "$URL" \
            --output outputs/audiofix/clip.mp4 \
            --start "$START" --seconds "$SECONDS_ARG"

      - name: Обрабатываем звук
        env:
          VARIANTS: ${{ inputs.variants }}   # через env — без подстановки в shell
        run: |
          set -o pipefail
          if [ "$VARIANTS" = "true" ]; then
            python scripts/audio_clean.py \
              --input outputs/audiofix/clip.mp4 \
              --output outputs/audiofix/clip.mp4 \
              --variants | tee outputs/audiofix/report.txt
          else
            python scripts/audio_clean.py \
              --input outputs/audiofix/clip.mp4 \
              --output outputs/audiofix/clip_audio_clean.mp4 | tee outputs/audiofix/report.txt
          fi

      - name: Отдаём файл(ы) на послушать
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-fix
          path: |
            outputs/audiofix/clip_*.mp4
            outputs/audiofix/report.txt
          if-no-files-found: ignore
