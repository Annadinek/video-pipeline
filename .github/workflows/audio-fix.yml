name: audio-fix

# Тест звука по кнопке: ссылка YouTube → качается кусок → прогоняется
# scripts/audio_clean.py (DeepFilterNet → подмес исходника → верх → loudnorm) →
# в логе цифры (фон, голос, верх 4–8 кГц, время), готовый файл
# clip_audio_clean.mp4 в артефактах.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Ссылка на видео YouTube'
        required: true
        type: string
      start:
        description: 'С какого места брать (мм:сс)'
        required: false
        default: '0:00'
        type: string
      seconds:
        description: 'Сколько секунд взять'
        required: false
        default: '30'
        type: string

jobs:
  audiofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Движок JavaScript — без него yt-dlp не решает n-challenge и не качает видео.
      - name: Ставим Deno (движок JS)
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Ставим yt-dlp и ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" yt-dlp-ejs
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # DeepFilterNet: строго совместимые версии (свежий torchaudio ломает импорт).
      # Модель лежит в репозитории (presets/deepfilternet/), скачивать не нужно.
      - name: Ставим DeepFilterNet (CPU)
        run: |
          python -m pip install deepfilternet==0.5.6
          python -m pip install torch==2.0.1 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          deepFilter --help >/dev/null 2>&1 && echo "deepFilter ок" || echo "::warning::deepFilter не импортируется"

      - name: Скачиваем отрезок (только для теста)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          URL: ${{ inputs.url }}            # через env — без подстановки в shell
          START: ${{ inputs.start }}
          SECONDS_ARG: ${{ inputs.seconds }}
        run: |
          python scripts/fetch_youtube.py \
            --url "$URL" \
            --output outputs/audiofix/clip.mp4 \
            --start "$START" --seconds "$SECONDS_ARG"

      - name: Обрабатываем звук
        run: |
          set -o pipefail
          python scripts/audio_clean.py \
            --input outputs/audiofix/clip.mp4 \
            --output outputs/audiofix/clip_audio_clean.mp4 | tee outputs/audiofix/report.txt

      - name: Отдаём файл на послушать
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-fix
          path: |
            outputs/audiofix/clip_audio_clean.mp4
            outputs/audiofix/report.txt
          if-no-files-found: ignore
