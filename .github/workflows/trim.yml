# trim.yml — вырезать начало видео (0..start сек) и прислать в бот на проверку.
name: trim
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Ссылка или ID видео YouTube"
        required: true
        default: "XVex3k1QuSo"
      start:
        description: "Сколько секунд отрезать с начала"
        required: false
        default: "22"
concurrency:
  group: trim
  cancel-in-progress: false
jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      TRIM_VIDEO: ${{ github.event.inputs.video }}
      TRIM_START: ${{ github.event.inputs.start || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Инструменты
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet -U --pre yt-dlp
          python3 -m pip install --quiet requests google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
          mkdir -p work
          if [ -n "${YT_COOKIES}" ]; then printf '%s' "$YT_COOKIES" > work/cookies.txt; fi
      - name: Обрезать и отправить в бот
        run: python3 scripts/trim_intro.py
