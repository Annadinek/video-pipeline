name: audio-variants

# Три варианта звука на послушать: ссылка YouTube → качается 30-сек отрезок →
# scripts/audio_clean.py --variants собирает clip_now / clip_mid / clip_max.
# Цепочка одна (highpass → вырез → шумодав → фикс-гейн), варианты давят фон
# сильнее (вырез −6/−10/−12, две полосы в максимуме). В логе — фон по шагам.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Ссылка на видео YouTube'
        required: true
        type: string
      start:
        description: 'С какого места брать (мм:сс)'
        required: false
        default: '0:00'
        type: string
      seconds:
        description: 'Сколько секунд взять'
        required: false
        default: '30'
        type: string

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Движок JavaScript — без него yt-dlp не решает n-challenge и не качает видео.
      - name: Ставим Deno (движок JS)
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Ставим yt-dlp и ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" yt-dlp-ejs
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Скачиваем отрезок (только для теста)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          URL: ${{ inputs.url }}            # через env — без подстановки в shell
          START: ${{ inputs.start }}
          SECONDS_ARG: ${{ inputs.seconds }}
        run: |
          python scripts/fetch_youtube.py \
            --url "$URL" \
            --output outputs/audiovariants/clip.mp4 \
            --start "$START" --seconds "$SECONDS_ARG"

      - name: Собираем три варианта (audio_clean.py --variants)
        run: |
          set -o pipefail
          python scripts/audio_clean.py \
            --input outputs/audiovariants/clip.mp4 \
            --output outputs/audiovariants/clip.mp4 \
            --variants | tee outputs/audiovariants/report.txt

      - name: Отдаём три варианта на послушать
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-variants
          path: |
            outputs/audiovariants/clip_now.mp4
            outputs/audiovariants/clip_mid.mp4
            outputs/audiovariants/clip_max.mp4
            outputs/audiovariants/report.txt
          if-no-files-found: ignore
