# poll.yml — каждые 5 минут проверяет ответ Анны в Telegram (Круг 1).
# «ОК» -> публикуем видео (public + субтитры + обложка). Правка -> фиксируем.
# Лёгкий и быстрый: без ffmpeg, только Telegram + YouTube API.
name: poll

on:
  # Расписание отключено: этот опрос каждые 5 минут «съедал» сообщения бота
  # (сдвигал offset getUpdates), в т.ч. присланные Анной файлы (музыку), и давал
  # 409 Conflict при других обращениях к боту. Плюс это нарушает ПРАВИЛО 13
  # (никаких опросов по расписанию). Оставляем только ручной запуск.
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

# Тот же замок, что и produce.yml — работаем строго по очереди.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Лёгкая установка (без ffmpeg)
        run: |
          python3 -m pip install --quiet requests \
            google-api-python-client google-auth google-auth-httplib2

      - name: Проверить ответ и, если «ОК», опубликовать
        run: |
          set -euo pipefail
          # Из корня репозитория — чтобы state.json и review/ были там же, где у produce.
          DECISION=$(python3 scripts/07_review_poll.py | tail -1)
          echo "Решение: $DECISION"
          case "$DECISION" in
            PUBLISH:*) python3 scripts/08_publish.py ;;
            *) echo "Публиковать нечего." ;;
          esac

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "video-pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json review 2>/dev/null || true
          git commit -m "poll: обновление состояния проверки" || echo "нечего коммитить"
          # Надёжный push с подтягиванием чужих коммитов и повтором.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && { echo "push ок"; break; } || { echo "повтор push ($i)"; sleep $((i*3)); }
          done
