# thumbs.yml — собирает 3 обложки из кадров reference/ и отправляет Анне в Telegram.
# Запуск вручную. Кадры берутся из папки reference/ (закоммичены analyze.yml).
name: thumbs

on:
  workflow_dispatch:

concurrency:
  group: thumbs
  cancel-in-progress: false

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Библиотеки
        run: python3 -m pip install --quiet Pillow requests
      - name: Собрать обложки, отправить и убрать прежнее
        run: |
          python3 scripts/make_thumbs.py
          # cleanup_bot.py шлёт свежие обложки и удаляет все более старые сообщения бота.
          # Запускаем из КОРНЯ: тогда и thumbs/ на месте, и import config/tg работает.
          python3 scripts/cleanup_bot.py
