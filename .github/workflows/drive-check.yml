# drive-check.yml — проверить, какие Google/Drive-доступы заведены в GitHub Secrets.
# НЕ печатает значения секретов — только «есть/нет», длину и тип учётных данных.
name: drive-check

on:
  push:
    branches:
      - "claude/reels-process-scaffold"
    paths:
      - "state/drive_check.txt"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - name: Наличие секретов (без значений)
        run: |
          check () { if [ -n "$2" ]; then echo "$1: ЕСТЬ (длина ${#2})"; else echo "$1: нет"; fi; }
          check GDRIVE_CREDENTIALS "$GDRIVE_CREDENTIALS"
          check GOOGLE_CREDENTIALS "$GOOGLE_CREDENTIALS"
          check GOOGLE_SERVICE_ACCOUNT "$GOOGLE_SERVICE_ACCOUNT"
          check YT_CLIENT_ID "$YT_CLIENT_ID"
          check YT_CLIENT_SECRET "$YT_CLIENT_SECRET"
          check YT_REFRESH_TOKEN "$YT_REFRESH_TOKEN"
      - name: Тип Drive-учётки (без секретов)
        run: |
          python3 - <<'PY'
          import os, json
          for name in ("GDRIVE_CREDENTIALS","GOOGLE_CREDENTIALS","GOOGLE_SERVICE_ACCOUNT"):
              v=os.environ.get(name,"")
              if not v:
                  print(f"{name}: нет"); continue
              try:
                  d=json.loads(v)
                  t=d.get("type","(нет поля type)")
                  has_email = "client_email" in d
                  dom = d.get("client_email","").split("@")[-1] if has_email else ""
                  scopes = d.get("scopes") or d.get("scope") or ""
                  print(f"{name}: JSON, type={t}, client_email={'да('+dom+')' if has_email else 'нет'}, scopes={scopes}")
              except Exception as e:
                  print(f"{name}: не JSON ({type(e).__name__}) — возможно, токен/строка")
          PY
