name: audio-ab

# Сравнение старых и новых настроек звука на настоящем видео.
# Вводишь ссылку YouTube → качается кусок (по умолчанию 5 минут) →
# звук прогоняется двумя цепочками → в логе таблица цифрами,
# два файла для прослушивания в артефактах.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Ссылка на видео YouTube'
        required: true
        type: string
      start:
        description: 'С какого места брать (мм:сс)'
        required: false
        default: '0:00'
        type: string
      seconds:
        description: 'Сколько секунд взять'
        required: false
        default: '300'
        type: string

jobs:
  ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Движок JavaScript — без него yt-dlp не решает n-challenge и не качает видео.
      - name: Ставим Deno (движок JS)
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Ставим yt-dlp и ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" yt-dlp-ejs
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Скачиваем отрезок
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          URL: ${{ inputs.url }}            # через env — без подстановки в shell
          START: ${{ inputs.start }}
          SECONDS_ARG: ${{ inputs.seconds }}
        run: |
          python scripts/fetch_youtube.py \
            --url "$URL" \
            --output outputs/ab/clip.mp4 \
            --start "$START" --seconds "$SECONDS_ARG"

      - name: Считаем старые и новые настройки
        run: |
          python scripts/audio_ab.py --input outputs/ab/clip.mp4 --outdir outputs/ab | tee outputs/ab/report.txt

      - name: Отдаём файлы для прослушивания
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-ab
          path: |
            outputs/ab/old.m4a
            outputs/ab/new.m4a
            outputs/ab/report.txt
            outputs/ab/report.json
          if-no-files-found: ignore
