# resub.yml — заменить большие вшитые субтитры на маленькие в клипах Vizard.
# Берёт готовые клипы из проекта Vizard, отрезает низ со старыми субтитрами,
# вбивает новые маленькие (караоке) и шлёт в бот с подписью.
name: resub

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Проект Vizard с готовыми клипами"
        required: true
        default: "33108048"
      indices:
        description: "Номера клипов через запятую (как в списке в боте)"
        required: true
        default: "1"
      blur_band:
        description: "Доля кадра снизу для размытия старых субтитров (0.18 = 18%)"
        required: false
        default: "0.18"
      font_size:
        description: "Размер новых субтитров (маленькие = 44)"
        required: false
        default: "44"
      preview_only:
        description: "1 = вынуть кадры на проверку (в бот не слать), 0 = слать в бот"
        required: false
        default: "0"
      raw_only:
        description: "1 = вынуть СЫРЫЕ кадры оригинальных клипов (проверить растяжение), без обработки"
        required: false
        default: "0"
      squeeze:
        description: "Горизонтальное сжатие против «широкого лица» (0.90 = на 10%). 0 = выкл"
        required: false
        default: "0"
      passthrough:
        description: "1 = отправить ОРИГИНАЛ клипа Vizard как есть (без обработки)"
        required: false
        default: "0"
      match20:
        description: "1 = кадрировать «как эталон 20» (убрать полосы + приблизить лицо), без искажения"
        required: false
        default: "0"
      target_fill:
        description: "Доля высоты кадра под лицо (0.40 = как эталон 20; больше = ближе)"
        required: false
        default: "0.40"
      captions_file:
        description: "Файл с подписями по номеру клипа (JSON). Пусто = «Ролик N»"
        required: false
        default: ""

concurrency:
  group: resub
  cancel-in-progress: false

jobs:
  resub:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VIZARDAI_API_KEY: ${{ secrets.VIZARDAI_API_KEY }}
      VIZARD_API_KEY: ${{ secrets.VIZARD_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      VIZARD_PROJECT_ID: ${{ github.event.inputs.project_id }}
      INDICES: ${{ github.event.inputs.indices }}
      BLUR_BAND: ${{ github.event.inputs.blur_band || '0.18' }}
      FONT_SIZE: ${{ github.event.inputs.font_size || '44' }}
      PREVIEW_ONLY: ${{ github.event.inputs.preview_only || '0' }}
      RAW_ONLY: ${{ github.event.inputs.raw_only || '0' }}
      SQUEEZE: ${{ github.event.inputs.squeeze || '0' }}
      PASSTHROUGH: ${{ github.event.inputs.passthrough || '0' }}
      MATCH20: ${{ github.event.inputs.match20 || '0' }}
      TARGET_FILL: ${{ github.event.inputs.target_fill || '0.40' }}
      FACE_MODEL: face_landmarker.task
      CAPTIONS_FILE: ${{ github.event.inputs.captions_file || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Инструменты
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --quiet requests faster-whisper
          # для режима MATCH20 (поиск лица) — mediapipe + opencv + модель
          if [ "${MATCH20}" = "1" ]; then
            python3 -m pip install --quiet mediapipe opencv-python-headless
            curl -sSL -o face_landmarker.task \
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
          fi
      - name: Заменить субтитры
        run: python3 scripts/resub.py
      - name: Сохранить кадры-проверки
        if: always()
        run: |
          git config user.name "video-pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add resub_preview 2>/dev/null || true
          git commit -m "resub: кадры-проверки" || echo "нечего коммитить"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4; do
            git pull --rebase origin "$BR" && git push origin "HEAD:$BR" && break || sleep $((i*3))
          done
