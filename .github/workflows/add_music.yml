# add_music.yml — берёт трек, залитый Анной в бот, накладывает его фоном под
# голос на субтитрованное видео и шлёт готовое в бот на проверку.
name: add-music

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Ссылка на субтитрованное видео (черновик)"
        required: false
        default: "https://youtu.be/FqD5mLEaRfc"
      music_gain:
        description: "Громкость музыки (0.10–0.25, тихий фон)"
        required: false
        default: "0.15"
      music_file:
        description: "Путь к треку в репозитории (пусто = искать в боте)"
        required: false
        default: "music/anna_piano.mp3"

concurrency:
  group: add-music
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      VIDEO_URL: ${{ github.event.inputs.video_url || 'https://youtu.be/FqD5mLEaRfc' }}
      MUSIC_GAIN: ${{ github.event.inputs.music_gain || '0.15' }}
      MUSIC_FILE: ${{ github.event.inputs.music_file }}
    steps:
      - uses: actions/checkout@v4
      - name: Инструменты
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 2>/dev/null || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 2>/dev/null || true
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet -U --pre yt-dlp
          python3 -m pip install --quiet requests google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh >/dev/null 2>&1 || true
            echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p work
          if [ -n "${YT_COOKIES}" ]; then printf '%s' "$YT_COOKIES" > work/cookies.txt; fi
      - name: Наложить музыку и отправить в бот
        run: python3 scripts/add_music.py
