# our_clip.yml — НАША вертикальная нарезка (вместо Vizard): кроп по лицу + субтитры,
# звук копией потока. Прогон на одном куске, готовый клип шлём в бот.
name: our-clip

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Ссылка или ID видео YouTube"
        required: true
        default: "LjkSHpRdaPk"
      seg_start:
        description: "С какой секунды взять кусок"
        required: false
        default: "30"
      seg_len:
        description: "Длина куска (сек)"
        required: false
        default: "45"

concurrency:
  group: our-clip
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      VIDEO_ID: ${{ github.event.inputs.video }}
      SEG_START: ${{ github.event.inputs.seg_start || '30' }}
      SEG_LEN: ${{ github.event.inputs.seg_len || '45' }}
      WHISPER_MODEL: medium
    steps:
      - uses: actions/checkout@v4
      - name: Инструменты
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 2>/dev/null || true
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1 2>/dev/null || true
          sudo apt-get update -qq
          # ffmpeg + шрифт для субтитров + системные либы для OpenCV
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libgl1 libglib2.0-0
          python3 -m pip install --quiet -U --pre yt-dlp
          # OpenCV 5.x убрал CascadeClassifier/cv2.data — берём 4.x (там слежение по лицу).
          python3 -m pip install --quiet requests faster-whisper "opencv-python-headless<5" numpy \
            google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
          # DeepFilterNet (звук): строго совместимые версии, модель уже в репозитории.
          # torch 2.0.1 ставим с обычного PyPI: с cpu-индекса старые колёса убрали.
          python3 -m pip install --quiet deepfilternet==0.5.6
          python3 -m pip install --quiet torch==2.0.1 torchaudio==2.0.2
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh >/dev/null 2>&1 || true
            echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p work
          if [ -n "${YT_COOKIES}" ]; then printf '%s' "$YT_COOKIES" > work/cookies.txt; fi
      - name: Проверка OpenCV
        run: python3 -c "import cv2; print('cv2', cv2.__version__, 'Cascade' , hasattr(cv2,'CascadeClassifier'))"
      - name: Наша нарезка + субтитры
        run: python3 scripts/our_clip.py
