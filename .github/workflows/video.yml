# Конвейер обработки видео на GitHub Actions.
# Работает, когда компьютер Анны выключен.
name: video-pipeline

on:
  # Раз в сутки ночью проверяем новое сырое видео.
  # Время в UTC. 01:00 UTC = 04:00 Стамбул (ночь).
  schedule:
    - cron: "0 1 * * *"
  # Ручной запуск (кнопкой на GitHub или командой из Telegram-бота).
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID видео на YouTube (из плейлиста «Клауд сырое»)"
        required: false
        default: ""

# Лимит 6 часов на задачу (шаг 5 CLAUDE.md). GitHub всё равно рубит на 6 ч.
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # чтобы дописывать log.md и state.json обратно в репозиторий
    steps:
      - name: Забираем репозиторий
        uses: actions/checkout@v4

      - name: Свободное место до старта
        run: df -h .

      - name: Установка инструментов
        run: bash scripts/setup.sh

      - name: Обработка видео (Часть А)
        # ВРЕМЕННО: пока запускаем по одному video_id из кнопки workflow_dispatch.
        # Автоматический обход плейлиста «Клауд сырое» подключим на живом тесте.
        run: |
          set -euo pipefail
          VID="${{ github.event.inputs.video_id }}"
          if [ -z "$VID" ]; then
            echo "video_id не задан — по расписанию обход плейлиста добавим позже. Выходим без ошибки."
            exit 0
          fi
          mkdir -p work
          python3 scripts/01_download.py "$VID"
          bash scripts/02_process.sh
          python3 scripts/03_transcribe.py

      - name: Запись в журнал (чтобы GitHub не отключил расписание через 60 дней)
        if: always()
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M UTC') — запуск конвейера, свободно: $(df -h . | tail -1 | awk '{print $4}')" >> log.md
          git config user.name "video-pipeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git add log.md state.json 2>/dev/null || true
          git commit -m "log: запуск конвейера" || echo "нечего коммитить"
          git push || echo "push не удался (нет изменений или прав)"
