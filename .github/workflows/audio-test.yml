name: audio-test

# Тест звука по кнопке: вводишь ссылку YouTube → качается отрезок 2 минуты →
# прогоняется scripts/audio_clean.py → в логе отчёт цифрами, файлы в артефактах.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Ссылка на видео YouTube'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Шаг 1 EJS: движок JavaScript. Deno включён в yt-dlp по умолчанию и берётся
      # первым, если найден. Без него yt-dlp пишет "JS runtimes: none" и не решает
      # n-challenge (видео не скачивается).
      - name: Ставим Deno (движок JS)
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- -y
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      # Шаг 2 EJS: скрипты решателя. Пакет yt-dlp-ejs идёт со стандартной поставкой
      # yt-dlp[default] с PyPI. Обновляем до свежего каждый запуск.
      - name: Ставим yt-dlp (полный набор с EJS) и ffmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default]" yt-dlp-ejs
          ffmpeg -version >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # Пункт 4: печатаем, какие движки видит yt-dlp. Строки "JS runtimes: none" быть не должно.
      - name: Какие движки видит yt-dlp
        run: |
          echo "deno: $(deno --version 2>/dev/null | head -1 || echo 'нет')"
          echo "node: $(node --version 2>/dev/null || echo 'нет')"
          RUNTIMES=$(yt-dlp -v --simulate "https://example.com" 2>&1 | grep -i "JS runtimes" | head -1 || true)
          echo "$RUNTIMES"
          if echo "$RUNTIMES" | grep -qi "none"; then
            echo "::warning::yt-dlp не видит ни одного JS-движка (JS runtimes: none) — n-challenge не решится."
          fi

      - name: Скачиваем отрезок 2 минуты
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          URL: ${{ inputs.url }}            # через env — без подстановки в shell
        run: |
          python scripts/fetch_youtube.py \
            --url "$URL" \
            --output outputs/ready/audio-test/clip.mp4 \
            --start 0:00 --seconds 120

      - name: Обрабатываем звук (режим сравнения)
        run: |
          python scripts/audio_clean.py \
            --input outputs/ready/audio-test/clip.mp4 \
            --output outputs/ready/audio-test/clip_audio_clean.mp4 \
            --compare

      - name: Отдаём файлы для прослушивания
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-test-compare
          path: |
            outputs/ready/audio-test/compare_nodenoise.mp4
            outputs/ready/audio-test/compare_low.mp4
            outputs/ready/audio-test/compare_medium.mp4
            outputs/ready/audio-test/compare_high.mp4
          if-no-files-found: ignore
