# send_covers.yml — отправить готовые обложки из assets/<id>/ в бот Анне.
name: send-covers

on:
  workflow_dispatch:
    inputs:
      video:
        description: "ID видео (папка assets/<id>/ с cover_1..3.jpg)"
        required: true
        default: "NtX08PXq7i8"

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      VIDEO_ID: ${{ github.event.inputs.video }}
    steps:
      - uses: actions/checkout@v4
      - name: Библиотеки
        run: python3 -m pip install --quiet requests
      - name: Отправить обложки в бот
        run: python3 scripts/send_covers.py "$VIDEO_ID"
